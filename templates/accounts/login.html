
{% extends 'base.html' %}

{% block content %}
<div class="login-container">
    <form method="post" class="login-form">
        {% csrf_token %}

        <h2>Вход в систему</h2>
        <p>Войдите в свой аккаунт Smart Stock</p>

        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
