
{% extends 'base.html' %}

{% block content %}
<div class="employee-create-page">
    <div class="employee-create-card">
        <div class="employee-create-header">
            <div class="employee-create-icon">✎</div>
            <div>
                <h2>Редактировать сотрудника</h2>
                <p>Измените данные сотрудника Smart Stock</p>
            </div>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% if form.errors %}
                <div class="employee-form-errors">
                    {{ form.errors }}
                </div>
            {% endif %}

            <div class="employee-form-grid">
                {% for field in form %}
                    <div class="employee-form-field">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        {{ field }}
                    </div>
                {% endfor %}
            </div>

            <button type="submit" class="employee-create-button">
                Сохранить изменения
            </button>
        </form>
    </div>
</div>
{% endblock %}
