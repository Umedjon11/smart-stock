{% extends 'base.html' %}

{% block content %}
<div class="order-form-page">
    <div class="order-form-card">
        <h2>Изменить статус заказа №{{ object.pk }}</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Сохранить статус</button>
            <a href="{% url 'order_detail' object.pk %}">Назад</a>
        </form>
    </div>
</div>
{% endblock %}
