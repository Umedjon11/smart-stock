<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить товар — SmartStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'products:product_list' %}">📦 SmartStock</a>
            <span class="text-white-50">Панель управления</span>
        </div>
    </nav>

    <!-- Основной контейнер с формой -->
    <div class="container my-5" style="max-width: 700px;">
        <div class="mb-3">
            <a href="{% url 'products:product_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill">
                ← Назад к каталогу
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <h1 class="h3 fw-bold text-dark mb-4">Добавить новый товар</h1>

            <!-- Важно: enctype="multipart/form-data" обязателен для загрузки картинок -->
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}

                {{ form.non_field_errors }}

                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <div class="form-text text-muted small">{{ field.help_text }}</div>
                        {% endif %}
                        {% for error in field.errors %}
                            <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-dark btn-lg rounded-pill">Сохранить товар</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
